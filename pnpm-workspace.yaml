packages:
  - "packages/*"
allowBuilds:
  '@biomejs/biome': true
  '@nestjs/core': false
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  better-sqlite3: true
  cpu-features: false
  esbuild: true
  prisma: true
  sharp: true
  ssh2: false
minimumReleaseAgeExclude:
  - '@dudousxd/*'
  - '@nestjs/authorization@0.1.3'
  - '@nestjs/storage@0.0.5'
  - '@nestjs/typeorm@12.0.3'
overrides:
  # Every @dudousxd/nestjs-telescope release up to 3.3.0 (this repo installs 3.0.0) pins
  # better-sqlite3 11.10.0, which neither ships a prebuild for nor compiles on Node 26. Drop this once
  # the devDependency is on a telescope release with better-sqlite3 12.
  '@dudousxd/nestjs-telescope>better-sqlite3': 12.11.1
